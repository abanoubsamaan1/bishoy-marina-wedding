# Netlify deployment
# The publish directory is the CONTENTS of `dist`, so the deployed site root
# contains index.html, images/ and audio/ — which is what the root-relative
# asset URLs (/images/..., /audio/...) in the bundle expect.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
